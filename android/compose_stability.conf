// Compose 稳定性契约。写在配置文件里而不是给类加 @Immutable/@Stable，是为了不让 core/data
// 反向依赖 compose-runtime（模块方向：core ← data ← tts ← ui）。
//
// BookMeta 含 cover: ByteArray? —— 编译器只看类型就判定 unstable，手写的 equals 对推断无影响。
// 实际上封面在导入时定型、生命周期内不再变化，equals 也覆盖了它的长度，语义上完全满足 Stable。
// 不声明的后果是 BookCell / BookCover / ContinueCard 永远无法跳过重组。
app.echoread.core.BookMeta

// 派生章节：构造后 text / paras / segments 都不再变化（换设置 = 换一个新实例）
app.echoread.data.DerivedChapter

// 应用级对象图：全是 val + StateFlow，实例本身在进程内唯一
app.echoread.AppGraph
